name: ci
on:
  # a pull request's branch runs once, on pull_request; push runs only for main
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ vars.COXSWAIN_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: nothing names an employer
        run: python3 .github/check_clean.py
