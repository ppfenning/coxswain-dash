[package]
name = "coxswain-dash"
version = "0.32.0"
edition = "2024"
rust-version = "1.85"
description = "coxtop: the Coxswain fleet dashboard"
publish = false

[[bin]]
name = "coxtop"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
portable-pty = "0.9.0"
vt100 = "0.15"

[dev-dependencies]
insta = "1"
tempfile = "3"
