[package]
name = "coxswain-dash"
version = "0.36.0"
edition = "2024"
rust-version = "1.85"
description = "coxtop: the Coxswain fleet dashboard"
publish = false

[[bin]]
name = "towpath"
path = "src/main.rs"
# insta names a snapshot file after the bin crate, and the stored snapshots are still named
# coxtop__*. src/coxtop.rs compiles the same code and tests, so the coxtop target runs them and
# this one does not. The snapshot rename is a separate task; flip this when it lands.
test = false

[[bin]]
name = "coxtop"
path = "src/coxtop.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
portable-pty = "0.9.0"
vt100 = "0.15"

[dev-dependencies]
insta = "1"
tempfile = "3"
